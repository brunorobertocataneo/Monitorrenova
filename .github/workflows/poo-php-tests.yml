name: Testes PHP
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar ambiente
        run: |
          printf 'DEMO_DB_PASSWORD=%s\nDEMO_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 18)" "$(openssl rand -hex 18)" > aplicacao/.env
          docker compose --env-file aplicacao/.env -f aplicacao/compose.demo.yaml -p monitorrenova-ci up -d --build
      - name: Executar testes
        run: |
          for teste in testar-crud-tarefas testar-gestao-tarefas testar-historico-tarefas testar-renderizacao-tarefas testar-filtros-demo testar-filtro-historico-demo; do
            docker compose --env-file aplicacao/.env -f aplicacao/compose.demo.yaml -p monitorrenova-ci exec -T web php "/var/www/src/$teste.php"
          done
      - name: Encerrar ambiente
        if: always()
        run: docker compose --env-file aplicacao/.env -f aplicacao/compose.demo.yaml -p monitorrenova-ci down -v
